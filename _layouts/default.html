<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.author.name }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta property="og:title" content="{{ site.author.name }} | {{ site.author.role }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/custom.css' | relative_url }}">
    <script>
        // Apply the saved theme before first paint to avoid a flash.
        try {
            var saved = localStorage.getItem('theme');
            if (saved) document.documentElement.setAttribute('data-theme', saved);
        } catch (e) {}
    </script>
</head>
<body>
{% include header.html %}
    <main>
{{ content }}
    </main>
{% include footer.html %}
    <script src="{{ '/assets/site.js' | relative_url }}"></script>
</body>
</html>
